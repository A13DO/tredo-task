<div class="flex items-center justify-center m-auto">

  <svg class="animated-bracket" width="40" height="200" viewBox="0 0 40 200"> <!-- Base grey bracket -->
    <path d="M30,0 C10,20 10,80 30,100 C10,120 10,180 30,200" fill="none" stroke="#ddd" stroke-width="4"
      stroke-linecap="round" /> <!-- Top half snake -->
    <path class="snake snake-top" d="M30,100 C10,80 10,20 30,0" fill="none" stroke="url(#gradTop)" stroke-width="4"
      stroke-linecap="round" stroke-dasharray="20 100" /> <!-- Bottom half snake -->
    <path class="snake snake-bottom" d="M30,100 C10,120 10,180 30,200" fill="none" stroke="url(#gradBottom)"
      stroke-width="4" stroke-linecap="round" stroke-dasharray="20 100" />
    <defs> <!-- Top gradient -->
      <linearGradient id="gradTop" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#4dd0e1" />
        <stop offset="100%" stop-color="#00796b" />
      </linearGradient> <!-- Bottom gradient -->
      <linearGradient id="gradBottom" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4dd0e1" />
        <stop offset="100%" stop-color="#00796b" />
      </linearGradient>
    </defs>
  </svg>
</div>
